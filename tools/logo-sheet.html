<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Anomie — running man</title>
    <style>
      body {
        margin: 0;
        background: #c0c0c0;
        font-family: 'MS Sans Serif', 'Microsoft Sans Serif', Tahoma, sans-serif;
        font-size: 11px;
        -webkit-font-smoothing: none;
        color: #000;
      }
      .sheet {
        padding: 26px 30px;
        display: flex;
        align-items: flex-end;
        gap: 30px;
      }
      figure {
        margin: 0;
        text-align: center;
      }
      figure div {
        margin: 0 auto 8px;
      }
      figcaption {
        color: #303030;
      }
      .rule {
        width: 2px;
        align-self: stretch;
        margin: 0 6px;
        box-shadow: inset 1px 0 #808080, inset -1px 0 #ffffff;
      }
      h1 {
        font-size: 11px;
        font-weight: bold;
        margin: 0;
        padding: 22px 30px 0;
      }
      .chip {
        background: #fff;
        padding: 6px;
        box-shadow: inset -1px -1px #fff, inset 1px 1px #808080,
          inset -2px -2px #dfdfdf, inset 2px 2px #0a0a0a;
      }
    </style>
  </head>
  <body>
    <h1>Anomie — the running man fades over the length of a session</h1>
    <div class="sheet" id="sheet"></div>

    <script type="module" src="./logo-sheet.js"></script>
  </body>
</html>
