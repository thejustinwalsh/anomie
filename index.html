<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anomie Instant Messenger</title>

    <meta
      name="description"
      content="A 1998 instant messenger where every buddy on your list is a language model running on your own machine. The Family group is never online."
    />
    <meta name="color-scheme" content="light" />
    <meta name="author" content="Justin Walsh" />

    <!-- Unfurls. og:image must be absolute — no unfurler resolves a relative path. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Anomie" />
    <meta property="og:title" content="Anomie Instant Messenger" />
    <meta
      property="og:description"
      content="We spent the 90s typing to strangers instead of talking to our neighbors. Now the thing on the other end isn't even a person — and it's better at being a buddy than anyone. Every name on this buddy list is a language model running on your own machine. The Family group is never online."
    />
    <meta property="og:url" content="https://tjw.dev/anomie/" />
    <meta property="og:image" content="https://tjw.dev/anomie/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A Windows 95 buddy list window floating over rolling green hills, with 'go touch grass' in arched WordArt across the sky."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Anomie Instant Messenger" />
    <meta
      name="twitter:description"
      content="A 1998 instant messenger where every buddy is a language model running on your machine. The Family group is never online."
    />
    <meta name="twitter:image" content="https://tjw.dev/anomie/og.png" />
  </head>
