<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so the teal desktop runs under the notch and the home
         indicator. interactive-widget=resizes-content makes the keyboard shrink
         the layout viewport instead of sliding it, which is what keeps the Send
         button on screen while you are typing. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Anomie Instant Messenger</title>

    <meta
      name="description"
      content="We spent the 90s talking to strangers instead of our neighbors. Now we talk to language models instead of either. The Family group is never online."
    />
    <meta name="color-scheme" content="light" />
    <meta name="author" content="Justin Walsh" />

    <!-- Unfurls. og:image must be absolute — no unfurler resolves a relative path. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Anomie" />
    <meta property="og:title" content="Anomie Instant Messenger" />
    <meta
      property="og:description"
      content="We spent the 90s talking to strangers instead of our neighbors. Now we talk to language models instead of either. The Family group is never online."
    />
    <meta property="og:url" content="https://tjw.dev/anomie/" />
    <meta property="og:image" content="https://tjw.dev/anomie/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A Windows 95 buddy list window floating over rolling green hills, with 'go touch grass' in arched WordArt across the sky."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Anomie Instant Messenger" />
    <!-- Twitter truncates harder than Facebook; the last sentence is the one
         that can go, because the turn is in "instead of either". -->
    <meta
      name="twitter:description"
      content="We spent the 90s talking to strangers instead of our neighbors. Now we talk to language models instead of either."
    />
    <meta name="twitter:image" content="https://tjw.dev/anomie/og.png" />
  </head>
  <body>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
